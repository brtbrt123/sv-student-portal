<text x="40.0" y="66.0" font-size="12" font-weight="400" fill="#6e6c85" text-anchor="start">6 actors. Solid line: association. Dashed arrow: include or extend. Orange line: every signed-in actor logs in with Supabase Auth. Blue line: every signed-in actor sees notifications.</text>
